[project]
name = "edumind-backend"
version = "0.1.0"
description = "EduMind Agent MVP backend"
requires-python = ">=3.11,<3.12"
dependencies = [
  "alembic==1.15.2",
  "asyncpg==0.30.0",
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "jsonschema==4.25.1",
  "sqlalchemy[asyncio]==2.0.40",
  "uvicorn[standard]==0.34.0",
]

[dependency-groups]
dev = [
  "mypy==1.15.0",
  "playwright==1.63.0",
  "pytest==8.3.5",
  "ruff==0.11.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["app"]
strict = true
