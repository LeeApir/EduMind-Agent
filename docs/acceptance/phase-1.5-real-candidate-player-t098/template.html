<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>真实候选：头插法课程</title><style>
:root{font:16px/1.6 system-ui,sans-serif;color:#1a2832;background:#f3f6f5}body{max-width:1120px;margin:auto;padding:24px}header,section{background:white;padding:22px;margin:0 0 18px;border:1px solid #d9e3df;border-radius:12px}h1,h2{line-height:1.25}.tag{color:#69510b;background:#fff2ca;border-radius:5px;padding:4px 8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.mono,code,pre{font-family:ui-monospace,monospace}.code{background:#12232c;color:#d9eeeb;overflow:auto;padding:12px;border-radius:8px}.line{display:block;white-space:pre}.line.active{background:#285b57;color:white}.toolbar{display:flex;flex-wrap:wrap;gap:8px}button{font:inherit;padding:7px 14px;cursor:pointer;border:1px solid #65867d;border-radius:6px;background:#eef8f3}button:disabled{opacity:.45}pre{overflow:auto;white-space:pre-wrap;background:#f4f8f6;padding:12px}details{margin:10px 0;padding:8px;border:1px solid #d8e2dd;border-radius:6px}@media(max-width:740px){body{padding:12px}.grid{grid-template-columns:1fr}}
</style></head><body><header><span class="tag">真实生成候选 · 未签核</span><h1>头插法：真实候选及状态回放</h1><p>讲解、题干和解析来自模型；代码、答案与轨迹来自程序。两次 malloc 的实际成功是本例假设，程序没有在此执行 C。t0/t1 是轨迹标签，并非 C 变量。</p><p>候选摘要：<code id="candidate-digest">__DIGEST__</code></p></header>
<section><h2>模型讲解</h2>__PARAGRAPHS__</section><section><h2>代码与状态</h2><p>前进动作只表示准备进入下一状态；显示状态后才更新状态。显示新状态时先清除旧代码高亮，之后的高亮动作再选定当前行。</p><div class="toolbar"><button id="play">播放</button><button id="pause">暂停</button><button id="prev">上一步</button><button id="next">下一步</button><button id="reset">重置</button></div><p id="progress" aria-live="polite"></p><p id="scope" aria-live="polite"></p><div class="grid"><div><h3>代码</h3><div id="code" class="code mono"></div></div><div><h3>当前动作</h3><pre id="event"></pre><h3>最近显示的状态</h3><pre id="state"></pre></div></div></section><section><h2>模型题目与程序参考答案</h2>__QUESTIONS__</section>
<script id="sample-data" type="application/json">__PAYLOAD__</script><script>
'use strict';const data=JSON.parse(document.querySelector('#sample-data').textContent),actions=data.actions,states=data.states;let cursor=-1,timer=null;const code=document.querySelector('#code'),eventOut=document.querySelector('#event'),stateOut=document.querySelector('#state'),progress=document.querySelector('#progress'),scope=document.querySelector('#scope');data.code.trimEnd().split('\n').forEach((line,i)=>{let el=document.createElement('span');el.className='line';el.dataset.line=String(i+1);el.textContent=String(i+1).padStart(2,' ')+'  '+line;code.appendChild(el)});
function render(){let state=null,line=null;for(let i=0;i<=cursor;i++){const a=actions[i];if(a.kind==='show_state'){state=states[a.step];line=null}if(a.kind==='highlight_code')line=a.line}for(const el of code.children)el.classList.toggle('active',Number(el.dataset.line)===line);const action=cursor<0?null:actions[cursor];eventOut.textContent=action?JSON.stringify(action,null,2):'尚未播放';stateOut.textContent=state?JSON.stringify(state,null,2):'尚无状态';scope.textContent=!state?'':state.phase==='initial'?'初始：函数局部变量不在作用域；null 不是当前 p/head 的空指针值。':state.phase==='caller'?'调用者阶段：函数局部 head 和 p 已离开作用域；它们在记录中是返回前快照。': '函数内部状态。';if(action&&action.kind==='advance_step')scope.textContent+=' 即将进入步骤 '+action.step+'；下一个显示动作才更新状态。';progress.textContent=`动作 ${cursor+1} / ${actions.length}`;progress.dataset.cursor=String(cursor);document.querySelector('#prev').disabled=cursor<0;document.querySelector('#next').disabled=cursor>=actions.length-1}
function stop(){if(timer!==null){clearInterval(timer);timer=null}}function next(){if(cursor<actions.length-1){cursor++;render()}if(cursor>=actions.length-1)stop()}document.querySelector('#play').addEventListener('click',()=>{if(timer===null&&cursor<actions.length-1)timer=setInterval(next,180)});document.querySelector('#pause').addEventListener('click',stop);document.querySelector('#next').addEventListener('click',()=>{stop();next()});document.querySelector('#prev').addEventListener('click',()=>{stop();if(cursor>=0)cursor--;render()});document.querySelector('#reset').addEventListener('click',()=>{stop();cursor=-1;render()});render();
</script></body></html>
