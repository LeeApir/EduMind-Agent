</style></head><body><header><small>有限 C 可行性 · 模型原文装配 · 未签核</small><h1>单链表头插</h1><p>本页代码、状态、高亮和参考答案由程序派生；教学正文、每步说明、题干与解析均为本次模型输出，无助手补写。轨迹为模拟，不执行 C。固定页面标签与反馈控件为程序模板。</p></header><section><h2>学习前提</h2><p id="prerequisites"></p><div id="paragraphs"></div></section><section><h2>代码与链表变化</h2><div class="toolbar"><button id="play">播放</button><button id="pause">暂停</button><button id="prev">上一步</button><button id="next">下一步</button><button id="reset">重置</button></div><p id="progress" aria-live="polite"></p><div class="grid"><div class="code" id="code"></div><div><h3 id="step-title"></h3><p id="step-note"></p><p id="chain"></p><div id="nodes"></div><pre id="vars"></pre><details><summary>准确状态与步骤</summary><pre id="state"></pre></details></div></div></section><section><h2>分配路径与资源生命周期</h2><p id="failure_scope"></p><p id="lifecycle"></p></section><section><h2>作答与解析</h2><div id="questions"></div><p id="score" aria-live="polite"></p></section><section><h2>学习回顾</h2><p id="learning_summary"></p><p>本页练习只作本地反馈，不产生正式掌握度。模型原始输出、失败和必要修订版本随本次执行证据保留；不能把引用存在或模型 pass 视作教学真值。</p><pre id="version"></pre></section><script type="application/json" id="payload">{"answers":{"allocation_failures":0,"caller_head":"t1","cycle_entry":null,"reachable_prefix":[2,1,9],"traversal_status":"terminated","unreachable_allocated_ids":[]},"code":"#include \u003cstdlib.h\u003e\ntypedef struct Node { int data; struct Node *next; } Node;\nNode *insert(Node *head, int value, int allocation_success) {\n    Node *p = allocation_success ? malloc(sizeof *p) : NULL;\n    if (p == NULL) return head;\n    p-\u003edata = value;\n    p-\u003enext = head;\n    return p;\n}\nint main(void) {\n    Node i0;\n    i0.data = 9;\n    i0.next = NULL;\n    Node *caller_head = \u0026i0;\n    caller_head = insert(caller_head, 1, 1);\n    caller_head = insert(caller_head, 2, 1);\n    (void)caller_head;\n    return 0;\n}\n","content":{"failure_scope":"本示例的分配掩码假定两次 malloc 都成功，失败次数为 0，因此没有展示 p == NULL 为真时的提前返回分支。抽象分配掩码不是真实 malloc 必然成功的保证；本示例也不证明任意 C 代码或内存安全。遍历在 NULL 结束，未出现环或不确定指针。","learning_summary":"通过一个固定示例学习头插：初始链表只有一个栈节点 i0；两次 insert 都在抽象分配掩码假定 malloc 成功的条件下创建动态节点 t0 和 t1，并分别把新节点链接到旧头之前。最终 caller_head 为 t1，遍历数据为 [2,1,9] 并在 NULL 结束。要区分函数局部指针与调用者变量，理解未初始化字段在写入前不可读，并知道动态节点需要最终安全释放而栈节点不能释放。","lifecycle":"i0 是 main 的栈节点，生命周期由所在作用域管理，不能 free。t0 和 t1 是两次成功 malloc 得到的动态节点；示例没有展示释放代码或清理动画，因此不能声称已经释放。若之后不再需要，安全释放顺序应先释放当前头 t1，再释放 t0，最后不释放 i0；不能在仍读取节点时释放它。","paragraphs":[{"fact_ids":["trace_step_00"],"key":"initial_list","text":"示例开始时，main 在栈上声明了节点 i0，把 i0.data 设为 9，把 i0.next 设为 NULL，并让局部变量 caller_head 指向 \u0026i0。因此初始链表只有一个栈节点 i0，遍历到 NULL 即结束。i0 不是 malloc 分配的，后续不能对它调用 free。"},{"fact_ids":["trace_step_01"],"key":"first_attempt","text":"第一次调用 insert(caller_head, 1, 1) 时，allocation_success 为 1，第 4 行执行 malloc(sizeof *p)，抽象分配掩码假定这次分配成功，p 指向新节点 t0。此时 t0 的 data 和 next 仍是 indeterminate（未初始化数据），不能读取。第 5 行检查 p == NULL 为假，所以不执行 return head，继续写入。"},{"fact_ids":["trace_step_02","trace_step_03","trace_step_04"],"key":"first_link_and_return","text":"第 6 行把 p-\u003edata 写成 1，第 7 行把 p-\u003enext 指向当时的局部 head，也就是 i0，形成 t0→i0。第 8 行 return p 返回 t0。函数内的局部 head 和 p 在返回后不再处于作用域；调用者看到的 p 值只是返回快照，不是仍在作用域的局部变量。"},{"fact_ids":["trace_step_05"],"key":"first_caller_result","text":"第 15 行把返回值赋给 caller_head，于是 caller_head 从 i0 变为 t0。链表为 t0(data=1)→i0(data=9)→NULL。t0 是成功 malloc 得到的动态节点，i0 仍是栈节点。"},{"fact_ids":["trace_step_06"],"key":"second_attempt","text":"第二次调用 insert(caller_head, 2, 1) 时，局部 head 是 t0，allocation_success 仍为 1，第 4 行假定 malloc 成功，p 指向新节点 t1，t1 的 data 和 next 为 indeterminate。第 5 行 NULL 检查为假，不提前返回。"},{"fact_ids":["trace_step_07","trace_step_08","trace_step_09"],"key":"second_link_and_return","text":"第 6 行写入 t1.data=2，第 7 行把 t1.next 指向局部 head 的当前值 t0，第 8 行返回 t1。此时链表为 t1→t0→i0→NULL，t1 和 t0 都是动态分配节点，i0 是栈节点。"},{"fact_ids":["trace_step_10","obs_caller_head","obs_reachable_prefix","obs_traversal_status","obs_allocation_failures"],"key":"final_observation","text":"第 16 行把返回值赋给 caller_head，最终 caller_head 为 t1。从 t1 出发观察到的数据前缀是 [2,1,9]，随后 next 到达 NULL，没有未知指针或重复，因此该指定示例的遍历状态为 terminated，观察到的值就是该示例的完整遍历。示例没有展示释放操作，所以不能声称清理已经执行；若之后不再需要，应安全释放动态节点 t1 和 t0，且不能释放栈节点 i0。"}],"prerequisites":"学习者已掌握 C 指针、struct、NULL 和函数返回值。本课只使用这些基础，不要求预先了解链表头插或动态内存管理细节。","questions":{"allocation_failures":{"explanation":"两次 insert 调用的 allocation_success 都为 1，抽象分配掩码假定两次 malloc 都成功，因此失败次数为 0。","fact_ids":["obs_allocation_failures","trace_step_01","trace_step_06"],"stem":"本示例中失败（未成功）的合成分配尝试次数是多少？请填写一个整数。"},"caller_head":{"explanation":"第 16 行把第二次 insert 的返回值 t1 赋给 caller_head，因此最终 caller_head 为 t1。","fact_ids":["obs_caller_head","trace_step_10"],"stem":"在这个示例执行完第 16 行后，caller_head 指向哪个节点 ID？请填写最终节点 ID（例如 t1 这样的标识符）。"},"reachable_prefix":{"explanation":"从 t1 开始依次读到 data 2、1、9，随后 next 为 NULL，所以已知整数前缀为 [2,1,9]，并且在该示例中这就是完整遍历。","fact_ids":["obs_reachable_prefix","obs_traversal_status"],"stem":"从最终 caller_head 出发，按遍历顺序记录节点 data，已知整数前缀是什么？请按顺序填写整数列表。"},"traversal_status":{"explanation":"观察到的 next 链为 t1→t0→i0→NULL，到达 NULL 且没有未知或重复，因此状态为 terminated。","fact_ids":["obs_traversal_status","obs_reachable_prefix"],"stem":"从最终 caller_head 出发观察，本示例的遍历状态是什么？可接受 token 为 terminated（到达 NULL 后结束）、cycle（进入环）、indeterminate（到达不确定指针）；请原样填写其中一个 token。"}},"step_notes":[{"frame_id":"f00","note":"main 在栈上建立 i0，data=9、next=NULL，并让 caller_head 指向 i0。此时只有 i0 一个节点，链表以 NULL 结束；i0 不是动态分配节点。","title":"初始状态：栈节点 i0 与 caller_head"},{"frame_id":"f01","note":"第 4 行在 allocation_success=1 下执行 malloc，抽象掩码假定成功，p 指向 t0。t0 的 data 和 next 仍为 indeterminate，尚未写入，不能读取其值。","title":"第一次分配：p 指向新节点 t0"},{"frame_id":"f02","note":"第 5 行检查 p == NULL。因为 p 指向 t0，检查为假，不执行 return head，继续执行第 6 行。这里展示的是成功分配后的路径，不是失败分支。","title":"第一次 NULL 检查：成功路径继续"},{"frame_id":"f03","note":"第 6 行把 value 1 写入 p-\u003edata，即 t0.data=1。t0.next 仍为 indeterminate，等待第 7 行链接。","title":"第一次写入数据：t0.data=1"},{"frame_id":"f04","note":"第 7 行把 p-\u003enext 设为局部 head 的当前值 i0，形成 t0→i0→NULL。局部 head 仍是 i0，调用者 caller_head 此时尚未被赋值。","title":"第一次链接：t0.next 指向 i0"},{"frame_id":"f05","note":"第 8 行 return p 返回 t0。函数返回后局部 head 和 p 不再处于作用域；调用者拿到的只是返回值快照，不是仍在作用域的局部变量。","title":"第一次返回：返回 t0"},{"frame_id":"f06","note":"第 15 行把返回值 t0 赋给 caller_head，链表变为 t0→i0→NULL。t0 是动态节点，i0 仍是栈节点。","title":"第一次调用者赋值：caller_head=t0"},{"frame_id":"f07","note":"第 4 行第二次调用在 allocation_success=1 下假定 malloc 成功，p 指向 t1。t1 的 data 和 next 为 indeterminate，尚未写入。","title":"第二次分配：p 指向新节点 t1"},{"frame_id":"f08","note":"第 5 行检查 p == NULL，因 p 指向 t1 而为假，不提前返回，继续写入数据。","title":"第二次 NULL 检查：成功路径继续"},{"frame_id":"f09","note":"第 6 行把 value 2 写入 t1.data，t1.next 仍为 indeterminate，等待链接。","title":"第二次写入数据：t1.data=2"},{"frame_id":"f10","note":"第 7 行把 t1.next 设为局部 head 的当前值 t0，形成 t1→t0→i0→NULL。局部 head 是 t0，调用者 caller_head 此时仍为 t0。","title":"第二次链接：t1.next 指向 t0"},{"frame_id":"f11","note":"第 8 行 return p 返回 t1。局部 head 和 p 在返回后不再处于作用域；返回值 t1 是调用者将要接收的快照。","title":"第二次返回：返回 t1"},{"frame_id":"f12","note":"第 16 行把返回值 t1 赋给 caller_head，最终 caller_head=t1。从 t1 遍历得到 [2,1,9] 并在 NULL 结束，状态为 terminated。示例未展示释放；若之后不再需要，应先释放 t1 再释放 t0，不能释放栈节点 i0。","title":"第二次调用者赋值与最终观察"}]},"frames":[{"fact_id":"trace_step_00","frame_id":"f00","kind":"initial","line":null,"state_index":0},{"fact_id":"trace_step_01","frame_id":"f01","kind":"allocate","line":4,"state_index":1},{"fact_id":"trace_step_01","frame_id":"f02","kind":"success_null_check","line":5,"state_index":1},{"fact_id":"trace_step_02","frame_id":"f03","kind":"data","line":6,"state_index":2},{"fact_id":"trace_step_03","frame_id":"f04","kind":"link","line":7,"state_index":3},{"fact_id":"trace_step_04","frame_id":"f05","kind":"return","line":8,"state_index":4},{"fact_id":"trace_step_05","frame_id":"f06","kind":"caller","line":15,"state_index":5},{"fact_id":"trace_step_06","frame_id":"f07","kind":"allocate","line":4,"state_index":6},{"fact_id":"trace_step_06","frame_id":"f08","kind":"success_null_check","line":5,"state_index":6},{"fact_id":"trace_step_07","frame_id":"f09","kind":"data","line":6,"state_index":7},{"fact_id":"trace_step_08","frame_id":"f10","kind":"link","line":7,"state_index":8},{"fact_id":"trace_step_09","frame_id":"f11","kind":"return","line":8,"state_index":9},{"fact_id":"trace_step_10","frame_id":"f12","kind":"caller","line":16,"state_index":10}],"states":[{"attempt":null,"caller_head":"i0","code_line":null,"local_head":null,"nodes":{"i0":{"data":9,"next":null}},"p":null,"phase":"initial","returned":null},{"attempt":0,"caller_head":"i0","code_line":4,"local_head":"i0","nodes":{"i0":{"data":9,"next":null},"t0":{"data":"indeterminate","next":"indeterminate"}},"p":"t0","phase":"allocate","returned":null},{"attempt":0,"caller_head":"i0","code_line":6,"local_head":"i0","nodes":{"i0":{"data":9,"next":null},"t0":{"data":1,"next":"indeterminate"}},"p":"t0","phase":"data","returned":null},{"attempt":0,"caller_head":"i0","code_line":7,"local_head":"i0","nodes":{"i0":{"data":9,"next":null},"t0":{"data":1,"next":"i0"}},"p":"t0","phase":"link","returned":null},{"attempt":0,"caller_head":"i0","code_line":8,"local_head":"i0","nodes":{"i0":{"data":9,"next":null},"t0":{"data":1,"next":"i0"}},"p":"t0","phase":"return","returned":"t0"},{"attempt":0,"caller_head":"t0","code_line":15,"local_head":"i0","nodes":{"i0":{"data":9,"next":null},"t0":{"data":1,"next":"i0"}},"p":"t0","phase":"caller","returned":"t0"},{"attempt":1,"caller_head":"t0","code_line":4,"local_head":"t0","nodes":{"i0":{"data":9,"next":null},"t0":{"data":1,"next":"i0"},"t1":{"data":"indeterminate","next":"indeterminate"}},"p":"t1","phase":"allocate","returned":null},{"attempt":1,"caller_head":"t0","code_line":6,"local_head":"t0","nodes":{"i0":{"data":9,"next":null},"t0":{"data":1,"next":"i0"},"t1":{"data":2,"next":"indeterminate"}},"p":"t1","phase":"data","returned":null},{"attempt":1,"caller_head":"t0","code_line":7,"local_head":"t0","nodes":{"i0":{"data":9,"next":null},"t0":{"data":1,"next":"i0"},"t1":{"data":2,"next":"t0"}},"p":"t1","phase":"link","returned":null},{"attempt":1,"caller_head":"t0","code_line":8,"local_head":"t0","nodes":{"i0":{"data":9,"next":null},"t0":{"data":1,"next":"i0"},"t1":{"data":2,"next":"t0"}},"p":"t1","phase":"return","returned":"t1"},{"attempt":1,"caller_head":"t1","code_line":16,"local_head":"t0","nodes":{"i0":{"data":9,"next":null},"t0":{"data":1,"next":"i0"},"t1":{"data":2,"next":"t0"}},"p":"t1","phase":"caller","returned":"t1"}],"version":"limited-c-full-course-r01"}</script><script>
'use strict';const data=JSON.parse(document.querySelector('#payload').textContent),$=s=>document.querySelector(s);let cursor=0,timer=null;for(const key of ['prerequisites','failure_scope','lifecycle','learning_summary'])$('#'+key).textContent=data.content[key];data.content.paragraphs.forEach(row=>{const p=document.createElement('p');p.textContent=row.text;$('#paragraphs').append(p)});data.code.trimEnd().split('\n').forEach((line,i)=>{const e=document.createElement('span');e.className='line';e.dataset.line=i+1;e.textContent=`${i+1}  ${line}`;$('#code').append(e)});const ptr=x=>x===null?'NULL':x==='indeterminate'?'未知':x;
function render(){const f=data.frames[cursor],s=data.states[f.state_index],n=data.content.step_notes[cursor];$('#progress').textContent=`步骤 ${cursor+1} / ${data.frames.length}`;$('#progress').dataset.cursor=cursor;$('#step-title').textContent=n.title;$('#step-note').textContent=n.note;document.querySelectorAll('.line').forEach(e=>e.classList.toggle('active',Number(e.dataset.line)===f.line));let id=s.caller_head,parts=[],seen=new Set();while(id!==null){if(seen.has(id)||!s.nodes[id]){parts.push('未知或重复');break}seen.add(id);parts.push(`${id}(${s.nodes[id].data})`);id=s.nodes[id].next}if(id===null)parts.push('NULL');$('#chain').textContent='caller_head → '+parts.join(' → ');$('#nodes').replaceChildren();Object.entries(s.nodes).forEach(([id,n])=>{const e=document.createElement('span');e.className='node';e.textContent=`${id} | data: ${ptr(n.data)} | next: ${ptr(n.next)}`;$('#nodes').append(e)});$('#vars').textContent=`caller_head = ${ptr(s.caller_head)}\n`+(['initial','caller'].includes(s.phase)?'head / p：不在作用域（原局部值仅作历史快照）':`head = ${ptr(s.local_head)}\np = ${ptr(s.p)}`);$('#state').textContent=JSON.stringify({frame:f,state:s},null,2);$('#prev').disabled=cursor===0;$('#next').disabled=cursor===data.frames.length-1;$('#play').disabled=timer!==null||cursor===data.frames.length-1;$('#pause').disabled=timer===null}function stop(){if(timer!==null)clearInterval(timer);timer=null;render()}function next(){if(cursor<data.frames.length-1)cursor++;if(cursor===data.frames.length-1)stop();else render()}$('#play').onclick=()=>{if(timer===null&&cursor<data.frames.length-1){timer=setInterval(next,1100);render()}};$('#pause').onclick=stop;$('#next').onclick=()=>{stop();next()};$('#prev').onclick=()=>{stop();cursor=Math.max(0,cursor-1);render()};$('#reset').onclick=()=>{stop();cursor=0;render()};
Object.entries(data.content.questions).forEach(([key,q],i)=>{const div=document.createElement('div');div.className='question';const label=document.createElement('label');label.htmlFor='a'+i;label.textContent=`${i+1}. ${q.stem}`;const input=document.createElement('input');input.id='a'+i;const hint=document.createElement('p');hint.textContent=key==='reachable_prefix'?'输入 JSON 整数数组':key==='allocation_failures'?'输入非负整数':key==='traversal_status'?'输入 terminated、cycle 或 indeterminate':'输入结点 ID，空指针用 none';const b=document.createElement('button');b.textContent='检查答案';const feedback=document.createElement('p');feedback.setAttribute('role','status');let expected=data.answers[key];if(key==='caller_head'&&expected===null)expected='none';const details=document.createElement('details'),summary=document.createElement('summary'),answer=document.createElement('p');summary.textContent='查看答案与解析';answer.textContent=`参考答案：${JSON.stringify(expected)}。${q.explanation}`;details.append(summary,answer);function score(){$('#score').textContent=`已答对 ${document.querySelectorAll('[data-correct="true"]').length} / 4 题`}b.onclick=()=>{let v=input.value.trim();if(!v){feedback.textContent='请先输入答案';return}try{if(['reachable_prefix','allocation_failures'].includes(key))v=JSON.parse(v)}catch{feedback.textContent='格式不正确，请按提示重试';return}const ok=JSON.stringify(v)===JSON.stringify(expected);div.dataset.correct=String(ok);feedback.textContent=ok?'回答正确，可展开解析核对思路':'还不一致，可回看过程或展开解析';score()};input.oninput=()=>{delete div.dataset.correct;feedback.textContent='';score()};input.onkeydown=e=>{if(e.key==='Enter')b.click()};div.append(label,document.createElement('br'),input,b,hint,feedback,details);$('#questions').append(div)});$('#version').textContent=data.version;render();
