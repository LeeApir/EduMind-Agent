<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'"><title>有限 C 中文头插课程</title><style>
body{max-width:1160px;margin:auto;padding:24px;background:#edf3f8;color:#18334b;font:17px/1.8 system-ui,sans-serif}section{padding:24px;background:white;margin:20px 0;border:1px solid #cad9e5;border-radius:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.grid>*{min-width:0}.code{background:#162b40;color:#e1edf8;padding:12px;overflow:auto;font:14px/1.9 monospace}.line{display:block;white-space:pre}.active{background:#9ed9fa;color:#092039}button,input{font:inherit;padding:7px 12px;margin:4px;border:1px solid #7998b1;border-radius:5px}button{cursor:pointer}button:disabled{opacity:.45}.toolbar{display:flex;flex-wrap:wrap}input{max-width:95%}.node{border:1px solid #2674ae;border-radius:7px;display:inline-block;padding:8px;margin:4px}pre{white-space:pre-wrap;overflow-wrap:anywhere}#chain{overflow-wrap:anywhere}button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid #ba5d16}small{color:#52687a}@media(max-width:760px){body{padding:10px}.grid{grid-template-columns:1fr}section{padding:16px}}
</style></head><body><header><small>有限 C 可行性 · 模型原文装配 · 未签核</small><h1>单链表头插</h1><p>本页代码、状态、高亮和参考答案由程序派生；教学正文、每步说明、题干与解析均为本次模型输出，无助手补写。轨迹为模拟，不执行 C。固定页面标签与反馈控件为程序模板。</p></header><section><h2>学习前提</h2><p id="prerequisites"></p><div id="paragraphs"></div></section><section><h2>代码与链表变化</h2><div class="toolbar"><button id="play">播放</button><button id="pause">暂停</button><button id="prev">上一步</button><button id="next">下一步</button><button id="reset">重置</button></div><p id="progress" aria-live="polite"></p><div class="grid"><div class="code" id="code"></div><div><h3 id="step-title"></h3><p id="step-note"></p><p id="chain"></p><div id="nodes"></div><pre id="vars"></pre><details><summary>准确状态与步骤</summary><pre id="state"></pre></details></div></div></section><section><h2>分配路径与资源生命周期</h2><p id="failure_scope"></p><p id="lifecycle"></p></section><section><h2>作答与解析</h2><div id="questions"></div><p id="score" aria-live="polite"></p></section><section><h2>学习回顾</h2><p id="learning_summary"></p><p>本页练习只作本地反馈，不产生正式掌握度。模型原始输出、失败和必要修订版本随本次执行证据保留；不能把引用存在或模型 pass 视作教学真值。</p><pre id="version"></pre></section><script type="application/json" id="payload">{"answers":{"allocation_failures":1,"caller_head":"t1","cycle_entry":null,"reachable_prefix":[5],"traversal_status":"terminated","unreachable_allocated_ids":[]},"code":"#include \u003cstdlib.h\u003e\ntypedef struct Node { int data; struct Node *next; } Node;\nNode *insert(Node *head, int value, int allocation_success) {\n    Node *p = allocation_success ? malloc(sizeof *p) : NULL;\n    if (p == NULL) return head;\n    p-\u003edata = value;\n    p-\u003enext = head;\n    return p;\n}\nint main(void) {\n    Node *caller_head = NULL;\n    caller_head = insert(caller_head, -3, 0);\n    caller_head = insert(caller_head, 5, 1);\n    (void)caller_head;\n    return 0;\n}\n","content":{"failure_scope":"第一次插入因分配成功掩码为 false 而未调用 malloc，p 为 NULL，NULL 检查成立并返回原 head（NULL），调用者头指针不变。本例只展示这一失败路径和一次成功插入，不证明其他分支或真实 malloc 行为。","learning_summary":"通过这个固定示例学习头插法中局部指针 p 与调用者 caller_head 的区别，理解分配成功掩码只是抽象假设，并区分失败返回与成功插入后的完整遍历和资源生命周期。","lifecycle":"本例初始链表为空，没有栈节点。第二次插入按抽象假设成功分配动态节点 t1，写入 data 和 next 后返回给调用者。成功分配的 t1 应在不再需要时安全释放，但本示例没有提供清理代码或清理动画，因此不能声称清理已经执行；也不应释放未分配或未知指针。","paragraphs":[{"fact_ids":["trace_step_00"],"key":"initial_list","text":"本例的 variant 是 normal，初始链表为空：main 中的 caller_head 初始为 NULL，没有任何初始节点。两次插入的值依次为 -3 和 5，对应的分配成功掩码依次为 false 和 true。这里的分配掩码只是抽象测试假设，并不保证真实 malloc 一定成功。"},{"fact_ids":["trace_step_01","trace_step_02","trace_step_03"],"key":"attempt_0","text":"第一次调用 insert 时 allocation_success 为 0，因此第 4 行的条件表达式不调用 malloc，局部指针 p 得到 NULL。随后第 5 行的 NULL 检查成立，函数直接返回传入的 head，也就是 NULL；这次调用没有创建节点，也没有修改调用者的头指针。"},{"fact_ids":["trace_step_04","trace_step_05","trace_step_06","trace_step_07"],"key":"attempt_1","text":"第二次调用 insert 时 allocation_success 为 1，第 4 行按抽象假设成功分配节点 t1，局部指针 p 指向 t1；此时 t1 的 data 和 next 仍是未初始化数据，不能读取。第 5 行的 NULL 检查不成立，继续执行第 6 行把 data 写为 5，第 7 行把 next 链接到传入的 head（NULL），第 8 行返回 t1。"},{"fact_ids":["trace_step_08"],"key":"caller_result","text":"第二次调用返回后，main 在第 13 行把返回值赋给 caller_head，因此 caller_head 指向 t1。注意 p 是 insert 的局部指针，调用返回后它只是返回时的快照，并不是 main 中仍可使用的变量；main 使用的是 caller_head。"},{"fact_ids":["obs_caller_head","obs_reachable_prefix","obs_traversal_status","obs_allocation_failures"],"key":"final_observation","text":"从 caller_head 出发观察，可达前缀为 [5]，t1 的 next 为 NULL，遍历状态为 terminated，因此对这个指定示例而言，观察到的值就是完整遍历结果。本例共发生 1 次失败的合成分配尝试。t1 是动态分配节点，成功分配后应在不再需要时安全释放；但本示例没有提供清理代码或清理动画，所以不能声称清理已经执行。初始链表为空，没有栈节点需要释放，也不应释放未分配或未知指针。"}],"prerequisites":"需要掌握 C 指针、struct、NULL 和函数返回值的基本含义；本课不假设其他学习历史。","questions":{"allocation_failures":{"explanation":"第一次插入的分配成功掩码为 false，对应 1 次失败尝试；第二次为 true。因此失败次数为 1。","fact_ids":["obs_allocation_failures","trace_step_02"],"stem":"本例中失败的合成分配尝试次数是多少？请回答一个整数。"},"caller_head":{"explanation":"第 13 行把 insert 的返回值赋给 caller_head，返回值为 t1，因此最终 caller_head 是 t1。","fact_ids":["obs_caller_head","trace_step_08"],"stem":"第二次 insert 返回后，main 中的 caller_head 最终指向哪个节点 ID？若为空请回答 none。请使用观察中的节点 ID 原样作答。"},"reachable_prefix":{"explanation":"可达前缀为 [5]；由于 next 到达 NULL 且没有未知或重复，这个指定示例的观察值就是完整遍历。","fact_ids":["obs_reachable_prefix","obs_traversal_status"],"stem":"从最终 caller_head 出发，已知的整数可达前缀是什么？请只回答一个 JSON 整数数组，例如 [1,2]；不要附加文字说明。"},"traversal_status":{"explanation":"t1 的 next 为 NULL，观察在 NULL 处终止，因此状态为 terminated。","fact_ids":["obs_traversal_status","trace_step_06"],"stem":"从最终 caller_head 出发观察，遍历状态是什么？请从固定枚举 token 中选择：terminated（在 NULL 处终止）、cycle（成环）、indeterminate（到达不确定指针）。"}},"step_notes":[{"frame_id":"f00","note":"main 中 caller_head 初始为 NULL，链表为空；尚未调用 insert，也没有节点。","title":"初始状态：空链表"},{"frame_id":"f01","note":"allocation_success 为 0，第 4 行的条件表达式使 p 为 NULL，没有调用 malloc，也没有创建节点。","title":"第一次尝试：第 4 行不分配"},{"frame_id":"f02","note":"第 5 行 p == NULL 成立，函数返回传入的 head，即 NULL；调用者头指针未被修改。","title":"第一次尝试：NULL 检查成立"},{"frame_id":"f03","note":"第 12 行把返回值 NULL 赋给 caller_head，链表仍为空；这次失败尝试没有产生动态节点。","title":"第一次调用返回后：caller_head 仍为 NULL"},{"frame_id":"f04","note":"allocation_success 为 1，按抽象假设成功分配节点 t1，p 指向 t1；此时 t1 的 data 和 next 仍是未初始化数据，不能读取。","title":"第二次尝试：第 4 行成功分配 t1"},{"frame_id":"f05","note":"第 5 行 p == NULL 不成立，因为 p 指向 t1，于是继续执行后续写入和链接。","title":"第二次尝试：NULL 检查不成立"},{"frame_id":"f06","note":"第 6 行把 value 5 写入 t1 的 data；t1 的 next 此时仍为未初始化数据。","title":"写入数据：t1-\u003edata 为 5"},{"frame_id":"f07","note":"第 7 行把 t1 的 next 设为传入的 head，即 NULL；此时 t1 成为唯一节点。","title":"链接：t1-\u003enext 指向 NULL"},{"frame_id":"f08","note":"第 8 行返回局部指针 p 的值 t1；p 是局部指针，返回后只是快照，不是 main 中仍可使用的变量。","title":"返回：insert 返回 t1"},{"frame_id":"f09","note":"第 13 行把返回值 t1 赋给 caller_head；从 caller_head 出发可达前缀为 [5]，next 为 NULL，遍历状态为 terminated。t1 是动态分配节点，应在不再需要时安全释放，但本示例没有展示清理执行。","title":"第二次调用返回后：caller_head 指向 t1"}]},"frames":[{"fact_id":"trace_step_00","frame_id":"f00","kind":"initial","line":null,"state_index":0},{"fact_id":"trace_step_01","frame_id":"f01","kind":"allocate","line":4,"state_index":1},{"fact_id":"trace_step_02","frame_id":"f02","kind":"allocation_failed","line":5,"state_index":2},{"fact_id":"trace_step_03","frame_id":"f03","kind":"caller","line":12,"state_index":3},{"fact_id":"trace_step_04","frame_id":"f04","kind":"allocate","line":4,"state_index":4},{"fact_id":"trace_step_04","frame_id":"f05","kind":"success_null_check","line":5,"state_index":4},{"fact_id":"trace_step_05","frame_id":"f06","kind":"data","line":6,"state_index":5},{"fact_id":"trace_step_06","frame_id":"f07","kind":"link","line":7,"state_index":6},{"fact_id":"trace_step_07","frame_id":"f08","kind":"return","line":8,"state_index":7},{"fact_id":"trace_step_08","frame_id":"f09","kind":"caller","line":13,"state_index":8}],"states":[{"attempt":null,"caller_head":null,"code_line":null,"local_head":null,"nodes":{},"p":null,"phase":"initial","returned":null},{"attempt":0,"caller_head":null,"code_line":4,"local_head":null,"nodes":{},"p":null,"phase":"allocate","returned":null},{"attempt":0,"caller_head":null,"code_line":5,"local_head":null,"nodes":{},"p":null,"phase":"allocation_failed","returned":null},{"attempt":0,"caller_head":null,"code_line":12,"local_head":null,"nodes":{},"p":null,"phase":"caller","returned":null},{"attempt":1,"caller_head":null,"code_line":4,"local_head":null,"nodes":{"t1":{"data":"indeterminate","next":"indeterminate"}},"p":"t1","phase":"allocate","returned":null},{"attempt":1,"caller_head":null,"code_line":6,"local_head":null,"nodes":{"t1":{"data":5,"next":"indeterminate"}},"p":"t1","phase":"data","returned":null},{"attempt":1,"caller_head":null,"code_line":7,"local_head":null,"nodes":{"t1":{"data":5,"next":null}},"p":"t1","phase":"link","returned":null},{"attempt":1,"caller_head":null,"code_line":8,"local_head":null,"nodes":{"t1":{"data":5,"next":null}},"p":"t1","phase":"return","returned":"t1"},{"attempt":1,"caller_head":"t1","code_line":13,"local_head":null,"nodes":{"t1":{"data":5,"next":null}},"p":"t1","phase":"caller","returned":"t1"}],"version":"limited-c-full-course-r01"}</script><script>
'use strict';const data=JSON.parse(document.querySelector('#payload').textContent),$=s=>document.querySelector(s);let cursor=0,timer=null;for(const key of ['prerequisites','failure_scope','lifecycle','learning_summary'])$('#'+key).textContent=data.content[key];data.content.paragraphs.forEach(row=>{const p=document.createElement('p');p.textContent=row.text;$('#paragraphs').append(p)});data.code.trimEnd().split('\n').forEach((line,i)=>{const e=document.createElement('span');e.className='line';e.dataset.line=i+1;e.textContent=`${i+1}  ${line}`;$('#code').append(e)});const ptr=x=>x===null?'NULL':x==='indeterminate'?'未知':x;
function render(){const f=data.frames[cursor],s=data.states[f.state_index],n=data.content.step_notes[cursor];$('#progress').textContent=`步骤 ${cursor+1} / ${data.frames.length}`;$('#progress').dataset.cursor=cursor;$('#step-title').textContent=n.title;$('#step-note').textContent=n.note;document.querySelectorAll('.line').forEach(e=>e.classList.toggle('active',Number(e.dataset.line)===f.line));let id=s.caller_head,parts=[],seen=new Set();while(id!==null){if(seen.has(id)||!s.nodes[id]){parts.push('未知或重复');break}seen.add(id);parts.push(`${id}(${s.nodes[id].data})`);id=s.nodes[id].next}if(id===null)parts.push('NULL');$('#chain').textContent='caller_head → '+parts.join(' → ');$('#nodes').replaceChildren();Object.entries(s.nodes).forEach(([id,n])=>{const e=document.createElement('span');e.className='node';e.textContent=`${id} | data: ${ptr(n.data)} | next: ${ptr(n.next)}`;$('#nodes').append(e)});$('#vars').textContent=`caller_head = ${ptr(s.caller_head)}\n`+(['initial','caller'].includes(s.phase)?'head / p：不在作用域（原局部值仅作历史快照）':`head = ${ptr(s.local_head)}\np = ${ptr(s.p)}`);$('#state').textContent=JSON.stringify({frame:f,state:s},null,2);$('#prev').disabled=cursor===0;$('#next').disabled=cursor===data.frames.length-1;$('#play').disabled=timer!==null||cursor===data.frames.length-1;$('#pause').disabled=timer===null}function stop(){if(timer!==null)clearInterval(timer);timer=null;render()}function next(){if(cursor<data.frames.length-1)cursor++;if(cursor===data.frames.length-1)stop();else render()}$('#play').onclick=()=>{if(timer===null&&cursor<data.frames.length-1){timer=setInterval(next,1100);render()}};$('#pause').onclick=stop;$('#next').onclick=()=>{stop();next()};$('#prev').onclick=()=>{stop();cursor=Math.max(0,cursor-1);render()};$('#reset').onclick=()=>{stop();cursor=0;render()};
Object.entries(data.content.questions).forEach(([key,q],i)=>{const div=document.createElement('div');div.className='question';const label=document.createElement('label');label.htmlFor='a'+i;label.textContent=`${i+1}. ${q.stem}`;const input=document.createElement('input');input.id='a'+i;const hint=document.createElement('p');hint.textContent=key==='reachable_prefix'?'输入 JSON 整数数组':key==='allocation_failures'?'输入非负整数':key==='traversal_status'?'输入 terminated、cycle 或 indeterminate':'输入结点 ID，空指针用 none';const b=document.createElement('button');b.textContent='检查答案';const feedback=document.createElement('p');feedback.setAttribute('role','status');let expected=data.answers[key];if(key==='caller_head'&&expected===null)expected='none';const details=document.createElement('details'),summary=document.createElement('summary'),answer=document.createElement('p');summary.textContent='查看答案与解析';answer.textContent=`参考答案：${JSON.stringify(expected)}。${q.explanation}`;details.append(summary,answer);function score(){$('#score').textContent=`已答对 ${document.querySelectorAll('[data-correct="true"]').length} / 4 题`}b.onclick=()=>{let v=input.value.trim();if(!v){feedback.textContent='请先输入答案';return}try{if(['reachable_prefix','allocation_failures'].includes(key))v=JSON.parse(v)}catch{feedback.textContent='格式不正确，请按提示重试';return}const ok=JSON.stringify(v)===JSON.stringify(expected);div.dataset.correct=String(ok);feedback.textContent=ok?'回答正确，可展开解析核对思路':'还不一致，可回看过程或展开解析';score()};input.oninput=()=>{delete div.dataset.correct;feedback.textContent='';score()};input.onkeydown=e=>{if(e.key==='Enter')b.click()};div.append(label,document.createElement('br'),input,b,hint,feedback,details);$('#questions').append(div)});$('#version').textContent=data.version;render();
</script></body></html>
