    "/api/learning-units/{learningUnitId}/classroom": {"get": {"tags": ["Classroom"],"summary": "读取课堂快照","operationId": "getClassroom","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/LearningUnitId"}],"responses": {"200": {"description": "成功。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClassroomSnapshot"}}}},"401": {"$ref": "#/components/responses/Unauthorized"},"404": {"$ref": "#/components/responses/NotFound"}}},"post": {"tags": ["Classroom"],"summary": "为已发布学习单元建立默认课堂","operationId": "createClassroom","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/LearningUnitId"},{"$ref": "#/components/parameters/CsrfToken"},{"$ref": "#/components/parameters/IdempotencyKey"}],"description": "默认focus/仅导师、revision=1；同owner+单元最多一个当前课堂。已存在且同键同摘要回放原快照；仅已审核且published_at非空的intro资源可创建课堂；不启动Provider。","responses": {"201": {"description": "新建默认课堂。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClassroomSnapshot"}}}},"200": {"description": "幂等回放已建课堂。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClassroomSnapshot"}}}},"401": {"$ref": "#/components/responses/Unauthorized"},"403": {"$ref": "#/components/responses/CsrfFailed"},"404": {"$ref": "#/components/responses/NotFound"},"409": {"description": "IDEMPOTENCY_CONFLICT；迁移前操作无可恢复原回执时为IDEMPOTENCY_RESULT_UNAVAILABLE。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},"422": {"$ref": "#/components/responses/ValidationError"}}}},
    "/api/learning-units/{learningUnitId}/classroom/messages": {"get": {"tags": ["Classroom"],"summary": "读取已提交课堂消息","operationId": "getClassroomMessages","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/LearningUnitId"},{"$ref": "#/components/parameters/AfterMessageCursor"}],"responses": {"200": {"description": "成功。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClassroomMessagePage"}}}},"401": {"$ref": "#/components/responses/Unauthorized"},"404": {"$ref": "#/components/responses/NotFound"},"409": {"$ref": "#/components/responses/MessageCursorInvalid"},"410": {"$ref": "#/components/responses/MessageCursorExpired"}},"description": "after只过滤已提交消息，不回放临时token；410后GET课堂快照取得message_cursor。"},"post": {"tags": ["Classroom"],"summary": "课堂发言流","operationId": "streamClassroomSpeech","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/LearningUnitId"},{"$ref": "#/components/parameters/CsrfToken"},{"$ref": "#/components/parameters/IdempotencyKey"},{"$ref": "#/components/parameters/IfMatchClassroomRevision"}],"responses": {"200": {"description": "POST fetch+ReadableStream；临时token不持久回放，只有审核通过的ready事件指向正式资源。","content": {"text/event-stream": {"schema": {"type": "string"}}}},"401": {"$ref": "#/components/responses/Unauthorized"},"403": {"$ref": "#/components/responses/CsrfFailed"},"404": {"$ref": "#/components/responses/NotFound"},"409": {"description": "IDEMPOTENCY_CONFLICT 或 课堂revision不匹配；code=CLASSROOM_VERSION_CONFLICT。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},"422": {"$ref": "#/components/responses/ValidationError"},"503": {"$ref": "#/components/responses/ReviewUnavailable"}},"requestBody": {"required": true,"content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClassroomSpeech"}}}},"description": "事件携带revision、scene_version、generation_id；低风险临时token可见，审核拒绝/不可用发content_retracted并禁止持久发布。 响应头发送前审核不可用可返回HTTP 503；流开始后只能发送content_retracted、error(code=REVIEW_UNAVAILABLE)、done(status=failed)，不能修改HTTP状态。SSE首个agent_start含operation_id，可用GET /api/classroom-operations/{operationId}读取持久操作状态；临时token不重放。"}},
    "/api/learning-units/{learningUnitId}/classroom/mode": {"patch": {"tags": ["Classroom"],"summary": "切换专注/互动和角色启用","operationId": "setClassroomMode","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/LearningUnitId"},{"$ref": "#/components/parameters/CsrfToken"},{"$ref": "#/components/parameters/IdempotencyKey"},{"$ref": "#/components/parameters/IfMatchClassroomRevision"}],"responses": {"200": {"description": "成功。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClassroomSnapshot"}}}},"401": {"$ref": "#/components/responses/Unauthorized"},"403": {"$ref": "#/components/responses/CsrfFailed"},"404": {"$ref": "#/components/responses/NotFound"},"409": {"description": "IDEMPOTENCY_CONFLICT 或 课堂revision不匹配；code=CLASSROOM_VERSION_CONFLICT；迁移前操作无可恢复原回执时为IDEMPOTENCY_RESULT_UNAVAILABLE。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},"422": {"$ref": "#/components/responses/ValidationError"}},"requestBody": {"required": true,"content": {"application/json": {"schema": {"$ref": "#/components/schemas/ModeChange"}}}},"description": "幂等命中先于If-Match检查，并返回该命令提交时保存的原快照；关闭角色先提交新revision和generation_id，迟到输出不能发布到当前会话。"}},
    "/api/learning-units/{learningUnitId}/classroom/controls": {"post":{"tags":["Classroom"],"summary":"学习控制","operationId":"controlClassroom","security":[{"sessionCookie":[]}],"parameters":[{"$ref":"#/components/parameters/LearningUnitId"},{"$ref":"#/components/parameters/CsrfToken"},{"$ref":"#/components/parameters/IdempotencyKey"},{"$ref":"#/components/parameters/IfMatchClassroomRevision"}],"responses":{"200":{"description":"成功。","content":{"application/json":{"schema":{"$ref":"#/components/schemas/ClassroomSnapshot"}}}},"401":{"$ref":"#/components/responses/Unauthorized"},"403":{"$ref":"#/components/responses/CsrfFailed"},"404":{"$ref":"#/components/responses/NotFound"},"409":{"description":"IDEMPOTENCY_CONFLICT、IDEMPOTENCY_RESULT_UNAVAILABLE、CLASSROOM_VERSION_CONFLICT或CLASSROOM_CONTROL_CONFLICT。","content":{"application/json":{"schema":{"$ref":"#/components/schemas/Error"}}}},"422":{"$ref":"#/components/responses/ValidationError"}},"requestBody":{"required":true,"content":{"application/json":{"schema":{"$ref":"#/components/schemas/LearningControl"}}}},"description":"暂停/继续、跳过、补前置和资源选择按owner、revision与幂等键提交；重复请求回放原快照。跳过记录显式反馈但不增加掌握分；资源选择需当前正式资源并记录行为事件；补前置需当前路径推荐的直接前置节点并保存返回点。动画选择不创建Job。"}},
    "/api/learning-units/{learningUnitId}/classroom/scenes/{sceneKey}/reexplanations": {"post": {"tags": ["Classroom"],"summary": "重解释当前场景","operationId": "reexplainScene","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/LearningUnitId"},{"$ref": "#/components/parameters/SceneKey"},{"$ref": "#/components/parameters/CsrfToken"},{"$ref": "#/components/parameters/IdempotencyKey"},{"$ref": "#/components/parameters/IfMatchClassroomRevision"}],"responses": {"200": {"description": "POST fetch+ReadableStream；临时token不持久回放，只有审核通过的ready事件指向正式资源。","content": {"text/event-stream": {"schema": {"type": "string"}}}},"401": {"$ref": "#/components/responses/Unauthorized"},"403": {"$ref": "#/components/responses/CsrfFailed"},"404": {"$ref": "#/components/responses/NotFound"},"409": {"description": "IDEMPOTENCY_CONFLICT 或 场景基版本过期；code=SCENE_VERSION_CONFLICT。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},"422": {"$ref": "#/components/responses/ValidationError"},"503": {"$ref": "#/components/responses/ReviewUnavailable"}},"requestBody": {"required": true,"content": {"application/json": {"schema": {"$ref": "#/components/schemas/ReexplanationRequest"}}}},"description": "证据仅表示提出需求；候选经schema/Review后用base_scene_version CAS发布。失败/断线保留旧正式版本。 响应头发送前审核不可用可返回HTTP 503；流开始后只能发送content_retracted、error(code=REVIEW_UNAVAILABLE)、done(status=failed)，不能修改HTTP状态。SSE首个agent_start含operation_id，可用GET /api/classroom-operations/{operationId}读取持久操作状态；临时token不重放。"}},
    "/api/learning-units/{learningUnitId}/classroom/debate": {"post": {"tags": ["Classroom"],"summary": "启动数组vs链表结构化演示","operationId": "startStructuredDebate","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/LearningUnitId"},{"$ref": "#/components/parameters/CsrfToken"},{"$ref": "#/components/parameters/IdempotencyKey"},{"$ref": "#/components/parameters/IfMatchClassroomRevision"}],"responses": {"401": {"$ref": "#/components/responses/Unauthorized"},"403": {"$ref": "#/components/responses/CsrfFailed"},"404": {"$ref": "#/components/responses/NotFound"},"409": {"description": "IDEMPOTENCY_CONFLICT 或 课堂revision不匹配；code=CLASSROOM_VERSION_CONFLICT。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},"422": {"$ref": "#/components/responses/ValidationError"},"503": {"$ref": "#/components/responses/ReviewUnavailable"},"200": {"description": "POST fetch+ReadableStream；结构化候选为临时数据，review_pass后debate_ready携带已发布结果ID；失败仅error/done。","content": {"text/event-stream": {"schema": {"type": "string"}}}}},"requestBody": {"required": true,"content": {"application/json": {"schema": {"$ref": "#/components/schemas/DebateRequest"}}}},"description": "一次结构化流式生成，三个视角及主持人总结整体审核；不并行生成。保存原课堂返回点。 流开始后Review不可用以error/done传达，不改HTTP状态；agent_start含operation_id，状态由GET课堂操作查询。"}},
    "/api/learning-units/{learningUnitId}/classroom/debate/{resultId}": {"get": {"tags": ["Classroom"],"summary": "读取已审核演示结果","operationId": "getStructuredDebate","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/LearningUnitId"},{"$ref": "#/components/parameters/DebateResultId"}],"responses": {"200": {"description": "成功。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/DebateResult"}}}},"401": {"$ref": "#/components/responses/Unauthorized"},"404": {"$ref": "#/components/responses/NotFound"}}}},
    "/api/learning-units/{learningUnitId}/classroom/debate/{resultId}/exit": {"post": {"tags": ["Classroom"],"summary": "退出演示并恢复课堂","operationId": "exitStructuredDebate","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/LearningUnitId"},{"$ref": "#/components/parameters/DebateResultId"},{"$ref": "#/components/parameters/CsrfToken"},{"$ref": "#/components/parameters/IdempotencyKey"},{"$ref": "#/components/parameters/IfMatchClassroomRevision"}],"responses": {"200": {"description": "成功。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClassroomSnapshot"}}}},"401": {"$ref": "#/components/responses/Unauthorized"},"403": {"$ref": "#/components/responses/CsrfFailed"},"404": {"$ref": "#/components/responses/NotFound"},"409": {"description": "IDEMPOTENCY_CONFLICT 或 课堂revision不匹配；code=CLASSROOM_VERSION_CONFLICT。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},"422": {"$ref": "#/components/responses/ValidationError"}},"description": "恢复scene_progress/模式/角色，message_cursor不回拨；若场景已更新则提示当前已审核版本。"}},
    "/api/learning-units/{learningUnitId}/classroom/debate/{resultId}/feedback": {"post": {"tags": ["Classroom"],"summary": "记录显式视角偏好","operationId": "recordPerspectiveFeedback","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/LearningUnitId"},{"$ref": "#/components/parameters/DebateResultId"},{"$ref": "#/components/parameters/CsrfToken"},{"$ref": "#/components/parameters/IdempotencyKey"}],"responses": {"202": {"description": "成功。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/PreferenceReceipt"}}}},"401": {"$ref": "#/components/responses/Unauthorized"},"403": {"$ref": "#/components/responses/CsrfFailed"},"404": {"$ref": "#/components/responses/NotFound"},"409": {"$ref": "#/components/responses/IdempotencyConflict"},"422": {"$ref": "#/components/responses/ValidationError"}},"requestBody": {"required": true,"content": {"application/json": {"schema": {"$ref": "#/components/schemas/PerspectiveFeedback"}}}},"description": "仅本owner已发布结果；证据先提交、画像版本异步合并，不从浏览/停留推断，不直接改掌握度。"}},
    "/api/learning-units/{learningUnitId}/notes.md": {"get": {"tags": ["Export"],"summary": "导出已审核Markdown学习笔记","operationId": "downloadMarkdownNotes","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/LearningUnitId"}],"responses": {"200": {"description": "仅当前owner正式资源；可选演示未发生时仍可导出；UTF-8及安全文件名。","content": {"text/markdown; charset=utf-8": {"schema": {"type": "string"}}},"headers": {"Content-Disposition": {"description": "attachment; filename使用服务端安全文件名。","schema": {"type": "string"}},"X-Content-Type-Options": {"schema": {"type": "string","const": "nosniff"}},"Cache-Control": {"schema": {"type": "string","const": "private, no-store"}}}},"401": {"$ref": "#/components/responses/Unauthorized"},"404": {"$ref": "#/components/responses/NotFound"}},"description": "只读GET；按Cookie会话与owner选择当前已审核讲解版本、本人合法练习版本的错题及可选已审核多视角总结，文件内记录来源模型、发布时间与内容版本；不需要写请求CSRF头，不调用Provider、动画或辩论。"}},
    "/api/classroom-operations/{operationId}": {"get": {"tags": ["Classroom"],"summary": "读取课堂流式操作的持久状态","operationId": "getClassroomOperation","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/ClassroomOperationId"}],"description": "断线先查操作状态；运行中仅等待/重新附着后续事件，不重新调用Provider；终态从课堂快照及正式资源恢复。临时token不回放。不推断进程中断即失败，遵ADR-0002最小恢复边界。","responses": {"200": {"description": "当前owner操作状态。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/ClassroomOperation"}}}},"401": {"$ref": "#/components/responses/Unauthorized"},"404": {"$ref": "#/components/responses/NotFound"}}}}
  },
  "components": {
    "securitySchemes": {"sessionCookie": {"type": "apiKey", "in": "cookie", "name": "edumind_session", "description": "Secure、HttpOnly、SameSite=Lax、Host-only Cookie，2h 绝对有效期；数据库只存令牌哈希。"}},
    "parameters": {
      "CsrfToken": {"name": "X-CSRF-Token", "in": "header", "required": true, "schema": {"type": "string", "minLength": 64, "maxLength": 64}, "description": "写请求必须提供；服务端同时验证同源 Origin。"},
      "IdempotencyKey": {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 16, "maxLength": 128}, "description": "客户端为一次创建操作生成的随机键；与认证身份和请求摘要绑定。"},
      "OperationId": {"name": "operationId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/Identifier"}},
      "LearningUnitId": {"name": "learningUnitId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/Identifier"}},
      "ResourceId": {"name": "resourceId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/Identifier"}},
      "NodeId": {"name": "nodeId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/KnowledgeNodeId"}},
      "TargetNodeId": {"name": "target_node_id", "in": "query", "required": true, "schema": {"$ref": "#/components/schemas/KnowledgeNodeId"}},
      "HistoryLimit": {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20}},
      "ProfileBeforeVersion": {"name": "before_version", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1}},
      "IfMatchProfileVersion": {"name": "If-Match-Profile-Version", "in": "header", "required": true, "schema": {"type": "integer", "minimum": 1}, "description": "客户端读取到的最新画像版本；不匹配时返回 PROFILE_VERSION_CONFLICT。"},
      "IfMatchPathVersion": {"name": "If-Match-Path-Version", "in": "header", "required": true, "schema": {"type": "integer", "minimum": 1}, "description": "客户端读取到的当前路径版本；不匹配时返回 PATH_VERSION_CONFLICT。"},
      "AnimationJobId": {"name": "jobId","in": "path","required": true,"schema": {"$ref": "#/components/schemas/Identifier"}},
      "MediaId": {"name": "mediaId","in": "path","required": true,"schema": {"$ref": "#/components/schemas/Identifier"}},
      "SceneKey": {"name": "sceneKey","in": "path","required": true,"schema": {"type": "string","pattern": "^[a-z0-9-]{1,64}$"}},
      "DebateResultId": {"name": "resultId","in": "path","required": true,"schema": {"$ref": "#/components/schemas/Identifier"}},
      "IfMatchClassroomRevision": {"name": "If-Match-Classroom-Revision","in": "header","required": true,"schema": {"type": "integer","minimum": 1},"description": "当前课堂revision。幂等命中先于版本检查。"},
      "LastEventId": {"name": "Last-Event-ID","in": "header","required": false,"schema": {"type": "integer","minimum": 0},"description": "动画Job事件：仅重放ID更大的已提交事件；过期410后GET快照取得last_event_id。"},
      "AnimationEventAfter": {"name": "after","in": "query","required": false,"schema": {"type": "integer","minimum": 0,"maximum": 999999999999999999},"description": "EventSource首次订阅不能自定义请求头，可用快照last_event_id作为初始游标；自动重连的Last-Event-ID头优先于本参数。"},
      "AfterMessageCursor": {"name": "after","in": "query","required": false,"schema": {"type": "integer","minimum": 0},"description": "仅返回此message_cursor之后已提交消息，不重放临时token。"},
      "ClassroomOperationId": {"name": "operationId","in": "path","required": true,"schema": {"$ref": "#/components/schemas/Identifier"}},
      "DownloadMedia": {"name": "download","in": "query","required": false,"schema": {"type": "boolean","default": false},"description": "false为播放器/字幕inline；true为附件下载，文件名仍由服务端生成。"}
    },
    "responses": {
      "LearningEventStream": {"description": "text/event-stream；事件定义见 x-sse-events。", "content": {"text/event-stream": {"schema": {"type": "string"}, "examples": {"temporaryToken": {"value": "event: token\\ndata: {\\\"operation_id\\\":\\\"op_123\\\",\\\"temporary\\\":true,\\\"delta\\\":\\\"链表插入先要保存...\\\"}\\n\\n"}}}}},
      "Unauthorized": {"description": "会话缺失、失效或不属于当前用户。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
