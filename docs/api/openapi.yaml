    "/api/animation-jobs/{jobId}/retry": {"post": {"tags": ["Animation"],"summary": "显式重试失败或已取消Job","operationId": "retryAnimationJob","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/AnimationJobId"},{"$ref": "#/components/parameters/CsrfToken"},{"$ref": "#/components/parameters/IdempotencyKey"}],"responses": {"202": {"description": "成功。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/AnimationJob"}}}},"401": {"$ref": "#/components/responses/Unauthorized"},"403": {"$ref": "#/components/responses/CsrfFailed"},"404": {"$ref": "#/components/responses/NotFound"},"409": {"description": "IDEMPOTENCY_CONFLICT 或 当前Job终态不允许该操作；code=JOB_STATE_CONFLICT。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},"422": {"$ref": "#/components/responses/ValidationError"}},"description": "创建新Job并保存retry_of；原终态不可修改。"}},
    "/api/animation-jobs/{jobId}/events": {"get": {"tags": ["Animation"],"summary": "持久Job事件流","operationId": "subscribeAnimationJob","security": [{"sessionCookie": []}],"parameters": [{"$ref": "#/components/parameters/AnimationJobId"},{"$ref": "#/components/parameters/LastEventId"},{"$ref": "#/components/parameters/AnimationEventAfter"}],"responses": {"200": {"description": "GET EventSource text/event-stream；事件ID为Job内单调整数。","content": {"text/event-stream": {"schema": {"type": "string"}}}},"401": {"$ref": "#/components/responses/Unauthorized"},"404": {"$ref": "#/components/responses/NotFound"},"409": {"$ref": "#/components/responses/EventCursorInvalid"},"410": {"$ref": "#/components/responses/EventCursorExpired"},"503": {"description": "本进程SSE连接容量已满；code=STREAM_CAPACITY。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}},"description": "无游标从头；Last-Event-ID只回放更大ID。终态且游标已消费则立即关闭。410后GET快照取last_event_id再订阅；心跳无持久ID。每进程最多32连接，轮询间隔1.5秒，单连接最多5分钟后由EventSource按游标重连；首次连接可用after查询参数，重连时Last-Event-ID头优先。"}},
