{
  "openapi": "3.1.0",
  "info": {
    "title": "EduMind MVP 0.2 API",
    "version": "0.2.0",
    "description": "MVP 0.2 的匿名学习闭环契约：保留 MVP 0.1 流式首屏与正式资源边界，新增版本化知识结构、渐进画像、服务端测验评分、掌握度与可解释路径。JSON 是 YAML 1.2 的合法子集，使用 .yaml 扩展名以便 OpenAPI 工具读取。"
  },
  "servers": [{"url": "/"}],
  "tags": [
    {"name": "Authentication"},
    {"name": "Learning"},
    {"name": "Resources"},
    {"name": "Knowledge Graph"},
    {"name": "Assessment"},
    {"name": "Learning Path"}
  ],
  "paths": {
    "/api/auth/guest": {
      "post": {
        "tags": ["Authentication"],
        "summary": "创建匿名身份",
        "operationId": "createGuestSession",
        "responses": {
          "201": {
            "description": "匿名用户已创建；服务端通过 Secure、HttpOnly、SameSite=Lax、Host-only Cookie 建立 2h 会话。请求有 Origin 时必须同源。",
            "headers": {"Set-Cookie": {"schema": {"type": "string"}, "description": "不透明的会话 Cookie；浏览器 JavaScript 不可读取。"}},
            "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GuestSession"}}}
          },
          "403": {"$ref": "#/components/responses/CsrfFailed"},
          "429": {"$ref": "#/components/responses/RateLimited"}
        }
      }
    },
    "/api/auth/session": {
      "get": {
        "tags": ["Authentication"],
        "summary": "验证会话并获取 CSRF token",
        "operationId": "getCurrentSession",
        "security": [{"sessionCookie": []}],
        "responses": {
          "200": {"description": "当前身份与写请求用 CSRF token。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/GuestSession"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"}
        }
      }
    },
    "/api/profile/me": {
      "get": {
        "tags": ["Learning"],
        "summary": "读取当前用户的最新画像版本",
        "operationId": "getMyProfile",
        "security": [{"sessionCookie": []}],
        "responses": {
          "200": {"description": "仅当前用户的最新画像快照。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudentProfile"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "404": {"$ref": "#/components/responses/NotFound"}
        }
      },
      "patch": {
        "tags": ["Learning"],
        "summary": "手动修正当前画像的白名单字段",
        "description": "只接受 `ProfileCorrectionRequest` 中的可修正字段。服务端从 Cookie 推导 owner，忽略任何客户端用户标识；每次有效修正创建带 `manual_correction` 证据的新不可变画像版本。",
        "operationId": "correctMyProfile",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/CsrfToken"}, {"$ref": "#/components/parameters/IdempotencyKey"}, {"$ref": "#/components/parameters/IfMatchProfileVersion"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfileCorrectionRequest"}}}},
        "responses": {
          "200": {"description": "已创建或重放画像版本。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StudentProfile"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/CsrfFailed"},
          "409": {"$ref": "#/components/responses/ProfileVersionConflict"},
          "422": {"$ref": "#/components/responses/ValidationError"}
        }
      }
    },
    "/api/profile/me/history": {
      "get": {
        "tags": ["Learning"],
        "summary": "读取当前 owner 的画像版本历史",
        "description": "按版本降序稳定返回去敏画像快照；不返回其他 owner、完整原始行为或 Provider 输入。",
        "operationId": "getMyProfileHistory",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/HistoryLimit"}, {"$ref": "#/components/parameters/ProfileBeforeVersion"}],
        "responses": {
          "200": {"description": "画像历史页。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfileHistoryPage"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"}
        }
      }
    },
    "/api/profile/events": {
      "post": {
        "tags": ["Learning"],
        "summary": "记录允许影响画像的学习行为",
        "description": "仅接受白名单行为摘要；测验作答必须使用专用测验提交端点，客户端不能写入得分、掌握状态或画像字段。事件持久化后才允许异步画像更新，Provider 失败不回滚事件。",
        "operationId": "recordProfileEvent",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/CsrfToken"}, {"$ref": "#/components/parameters/IdempotencyKey"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfileEventRequest"}}}},
        "responses": {
          "202": {"description": "事件已持久化；画像更新可能仍在处理。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/ProfileEventReceipt"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/CsrfFailed"},
          "409": {"$ref": "#/components/responses/IdempotencyConflict"},
          "422": {"$ref": "#/components/responses/ValidationError"}
        }
      }
    },
    "/api/auth/register": {
      "post": {
        "tags": ["Authentication"],
        "summary": "将当前匿名身份升级为新账号",
        "operationId": "registerGuestAccount",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/CsrfToken"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/RegisterRequest"}}}},
        "responses": {
          "200": {"description": "同一用户记录已绑定账号，服务端已轮换会话 Cookie。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/User"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/CsrfFailed"},
          "409": {"$ref": "#/components/responses/AccountConflict"}
        }
      }
    },
    "/api/learning-sessions": {
      "post": {
        "tags": ["Learning"],
        "summary": "创建学习会话，流式返回临时首段并审核发布正式资源",
        "description": "首段 `token` 是待审核的临时内容；流结束后服务依次发送 `stage_changed(reviewing)`，再按审核结果发送 `review_pass` 和 `scene_ready`，或 `review_reject`。只有 `scene_ready` 指向的版本可作为正式资源读取、恢复或导出。相同匿名用户、相同 Idempotency-Key 和相同请求摘要必须返回同一操作，不能创建重复资源。",
        "operationId": "startLearningSession",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/IdempotencyKey"}, {"$ref": "#/components/parameters/CsrfToken"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/StartLearningRequest"}}}},
        "responses": {
          "200": {"$ref": "#/components/responses/LearningEventStream"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/CsrfFailed"},
          "409": {"$ref": "#/components/responses/IdempotencyConflict"},
          "422": {"$ref": "#/components/responses/ValidationError"},
          "429": {"$ref": "#/components/responses/RateLimited"}
        }
      }
    },
    "/api/learning-operations/{operationId}": {
      "get": {
        "tags": ["Learning"],
        "summary": "读取可恢复的学习操作状态",
        "description": "用于 POST SSE 断线或服务重启后的恢复。不会回放临时 token；若已发布，响应提供正式学习单元和场景版本。",
        "operationId": "getLearningOperation",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/OperationId"}],
        "responses": {
          "200": {"description": "当前持久化状态。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LearningOperation"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "404": {"$ref": "#/components/responses/NotFound"}
        }
      },
      "delete": {
        "tags": ["Learning"],
        "summary": "取消未终结的学习操作",
        "description": "取消意图被持久化，重复取消为幂等成功。已发布版本不会删除；未发布候选不得被读取。",
        "operationId": "cancelLearningOperation",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/OperationId"}, {"$ref": "#/components/parameters/CsrfToken"}],
        "responses": {
          "202": {"description": "已接受取消。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LearningOperation"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/CsrfFailed"},
          "404": {"$ref": "#/components/responses/NotFound"}
        }
      }
    },
    "/api/learning-operations/{operationId}/events": {
      "get": {
        "tags": ["Learning"],
        "summary": "重新附着正在运行的学习操作事件流",
        "description": "仅发送连接建立后的事件；客户端应先读取操作状态。临时 token 不保证回放，已发布资源通过 learning unit API 读取。",
        "operationId": "subscribeLearningOperation",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/OperationId"}],
        "responses": {
          "200": {"$ref": "#/components/responses/LearningEventStream"},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "404": {"$ref": "#/components/responses/NotFound"}
        }
      }
    },
    "/api/learning-units/{learningUnitId}": {
      "get": {
        "tags": ["Learning"],
        "summary": "读取学生可见的学习单元",
        "description": "只返回所有者拥有且已审核发布的场景与资源版本；不得泄露临时候选。",
        "operationId": "getLearningUnit",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/LearningUnitId"}],
        "responses": {
          "200": {"description": "学习单元。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LearningUnit"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "404": {"$ref": "#/components/responses/NotFound"}
        }
      }
    },
    "/api/resource/{resourceId}": {
      "get": {
        "tags": ["Resources"],
        "summary": "读取已审核的学习资源",
        "operationId": "getResource",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/ResourceId"}],
        "responses": {
          "200": {"description": "正式资源。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PublishedResource"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "404": {"$ref": "#/components/responses/NotFound"}
        }
      }
    },
    "/api/resources/{resourceId}": {
      "get": {
        "tags": ["Resources"],
        "summary": "兼容路径：读取已审核学习资源",
        "deprecated": true,
        "operationId": "getResourceLegacyAlias",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/ResourceId"}],
        "responses": {
          "200": {"description": "正式资源。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PublishedResource"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "404": {"$ref": "#/components/responses/NotFound"}
        }
      }
    },
    "/api/graph": {
      "get": {
        "tags": ["Knowledge Graph"],
        "summary": "读取当前版本的公共知识结构",
        "description": "公共种子图谱不包含任何用户掌握度、画像或学习记录；节点和关系均按稳定 ID 排序。",
        "operationId": "getKnowledgeGraph",
        "responses": {
          "200": {"description": "已校验的版本化图谱。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/KnowledgeGraph"}}}}
        }
      }
    },
    "/api/graph/node/{nodeId}": {
      "get": {
        "tags": ["Knowledge Graph"],
        "summary": "读取公共知识节点详情",
        "operationId": "getKnowledgeNode",
        "parameters": [{"$ref": "#/components/parameters/NodeId"}],
        "responses": {
          "200": {"description": "节点及其稳定排序的入/出关系。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/KnowledgeNodeDetail"}}}},
          "404": {"$ref": "#/components/responses/GraphNodeNotFound"}
        }
      }
    },
    "/api/quiz-submissions": {
      "post": {
        "tags": ["Assessment"],
        "summary": "提交已发布练习并由服务端评分",
        "description": "请求必须引用当前 owner 可读取的已发布练习资源及版本。服务端使用资源中受审核的标准答案确定性评分，持久化不可变作答证据和错误模式；不信任客户端的分数、正确性、题干或答案键。",
        "operationId": "submitQuiz",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/CsrfToken"}, {"$ref": "#/components/parameters/IdempotencyKey"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QuizSubmissionRequest"}}}},
        "responses": {
          "200": {"description": "逐题评分、持久化证据和本次掌握度变化。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/QuizSubmissionResult"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/CsrfFailed"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "409": {"$ref": "#/components/responses/IdempotencyConflict"},
          "422": {"$ref": "#/components/responses/QuizSubmissionInvalid"}
        }
      }
    },
    "/api/mastery": {
      "get": {
        "tags": ["Assessment"],
        "summary": "读取当前 owner 的节点掌握度",
        "description": "仅返回当前投影、规则版本和去敏证据摘要；按知识节点 ID 稳定排序。",
        "operationId": "getMyMastery",
        "security": [{"sessionCookie": []}],
        "responses": {
          "200": {"description": "当前掌握度投影。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/MasteryList"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"}
        }
      }
    },
    "/api/path/plan": {
      "post": {
        "tags": ["Learning Path"],
        "summary": "为目标节点创建初始学习路径版本",
        "description": "规划只使用已提交的图谱、画像与掌握度快照，不调用 Provider。服务端从 Cookie 推导 owner，固定输入及规则版本后创建不可变路径版本。",
        "operationId": "planLearningPath",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/CsrfToken"}, {"$ref": "#/components/parameters/IdempotencyKey"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PathPlanRequest"}}}},
        "responses": {
          "201": {"description": "已创建或重放路径版本。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LearningPath"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/CsrfFailed"},
          "404": {"$ref": "#/components/responses/GraphNodeNotFound"},
          "409": {"$ref": "#/components/responses/IdempotencyConflict"},
          "422": {"$ref": "#/components/responses/PathUnreachable"}
        }
      }
    },
    "/api/path/current": {
      "get": {
        "tags": ["Learning Path"],
        "summary": "读取当前 owner 的指定目标路径",
        "description": "响应包含当前路径版本及是否落后于最新证据；不存在、属于其他 owner 的路径一律返回 NOT_FOUND。",
        "operationId": "getCurrentLearningPath",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/TargetNodeId"}],
        "responses": {
          "200": {"description": "当前路径版本。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LearningPath"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "404": {"$ref": "#/components/responses/NotFound"}
        }
      }
    },
    "/api/path/replan": {
      "post": {
        "tags": ["Learning Path"],
        "summary": "按最新持久化输入重规划路径",
        "description": "请求必须携带客户端看到的当前路径版本。若输入水位已变，服务端以最新快照重算并创建新版本；若指定版本已被其他请求取代，返回明确版本冲突，不静默覆盖。",
        "operationId": "replanLearningPath",
        "security": [{"sessionCookie": []}],
        "parameters": [{"$ref": "#/components/parameters/CsrfToken"}, {"$ref": "#/components/parameters/IdempotencyKey"}, {"$ref": "#/components/parameters/IfMatchPathVersion"}],
        "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/PathReplanRequest"}}}},
        "responses": {
          "200": {"description": "已创建或重放新路径版本，包含变化理由。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/LearningPath"}}}},
          "401": {"$ref": "#/components/responses/Unauthorized"},
          "403": {"$ref": "#/components/responses/CsrfFailed"},
          "404": {"$ref": "#/components/responses/NotFound"},
          "409": {"$ref": "#/components/responses/PathVersionConflict"},
          "422": {"$ref": "#/components/responses/PathUnreachable"}
        }
      }
    }
  },
  "components": {
    "securitySchemes": {"sessionCookie": {"type": "apiKey", "in": "cookie", "name": "edumind_session", "description": "Secure、HttpOnly、SameSite=Lax、Host-only Cookie，2h 绝对有效期；数据库只存令牌哈希。"}},
    "parameters": {
      "CsrfToken": {"name": "X-CSRF-Token", "in": "header", "required": true, "schema": {"type": "string", "minLength": 64, "maxLength": 64}, "description": "写请求必须提供；服务端同时验证同源 Origin。"},
      "IdempotencyKey": {"name": "Idempotency-Key", "in": "header", "required": true, "schema": {"type": "string", "minLength": 16, "maxLength": 128}, "description": "客户端为一次创建操作生成的随机键；与认证身份和请求摘要绑定。"},
      "OperationId": {"name": "operationId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/Identifier"}},
      "LearningUnitId": {"name": "learningUnitId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/Identifier"}},
      "ResourceId": {"name": "resourceId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/Identifier"}},
      "NodeId": {"name": "nodeId", "in": "path", "required": true, "schema": {"$ref": "#/components/schemas/KnowledgeNodeId"}},
      "TargetNodeId": {"name": "target_node_id", "in": "query", "required": true, "schema": {"$ref": "#/components/schemas/KnowledgeNodeId"}},
      "HistoryLimit": {"name": "limit", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1, "maximum": 50, "default": 20}},
      "ProfileBeforeVersion": {"name": "before_version", "in": "query", "required": false, "schema": {"type": "integer", "minimum": 1}},
      "IfMatchProfileVersion": {"name": "If-Match-Profile-Version", "in": "header", "required": true, "schema": {"type": "integer", "minimum": 1}, "description": "客户端读取到的最新画像版本；不匹配时返回 PROFILE_VERSION_CONFLICT。"},
      "IfMatchPathVersion": {"name": "If-Match-Path-Version", "in": "header", "required": true, "schema": {"type": "integer", "minimum": 1}, "description": "客户端读取到的当前路径版本；不匹配时返回 PATH_VERSION_CONFLICT。"}
    },
    "responses": {
      "LearningEventStream": {"description": "text/event-stream；事件定义见 x-sse-events。", "content": {"text/event-stream": {"schema": {"type": "string"}, "examples": {"temporaryToken": {"value": "event: token\\ndata: {\\\"operation_id\\\":\\\"op_123\\\",\\\"temporary\\\":true,\\\"delta\\\":\\\"链表插入先要保存...\\\"}\\n\\n"}}}}},
      "Unauthorized": {"description": "会话缺失、失效或不属于当前用户。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "CsrfFailed": {"description": "Origin 或 CSRF token 校验失败。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "NotFound": {"description": "资源不存在，或不属于当前用户。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "ValidationError": {"description": "请求未通过 schema 校验。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "IdempotencyConflict": {"description": "同一幂等键被用于不同请求摘要。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "AccountConflict": {"description": "目标账号已存在；MVP 不自动合并匿名数据。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "RateLimited": {"description": "请求受限。", "headers": {"Retry-After": {"schema": {"type": "integer", "minimum": 1}}}, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "ProfileVersionConflict": {"description": "画像版本已被其他有效更新推进；客户端必须重新读取后再提交。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "PathVersionConflict": {"description": "当前路径版本已改变；客户端必须重新读取最新路径。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "GraphNodeNotFound": {"description": "公共图谱中不存在该稳定节点 ID。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "QuizSubmissionInvalid": {"description": "练习不是已发布资源、版本/题目不匹配，或答案不符合题目 schema。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "PathUnreachable": {"description": "目标节点不存在有效可达路径，或图谱前置关系不满足。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}
