      "QuizSubmissionInvalid": {"description": "练习不是已发布资源、版本/题目不匹配，或答案不符合题目 schema。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "PathUnreachable": {"description": "目标节点不存在有效可达路径，或图谱前置关系不满足。", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "JobStateConflict": {"description": "当前Job终态不允许该操作；code=JOB_STATE_CONFLICT。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "ClassroomVersionConflict": {"description": "课堂revision不匹配；code=CLASSROOM_VERSION_CONFLICT。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "SceneVersionConflict": {"description": "场景基版本过期；code=SCENE_VERSION_CONFLICT。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "EventCursorInvalid": {"description": "动画事件游标超过当前最大值；code=EVENT_CURSOR_INVALID。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "EventCursorExpired": {"description": "动画事件已清理；code=EVENT_CURSOR_EXPIRED，GET快照取得last_event_id后重订阅。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "MessageCursorInvalid": {"description": "课堂消息游标超过当前最大值；code=MESSAGE_CURSOR_INVALID。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "MessageCursorExpired": {"description": "课堂消息游标已清理；code=MESSAGE_CURSOR_EXPIRED，GET快照。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "MediaNotReady": {"description": "未生成或尚未审核发布；code=MEDIA_NOT_READY。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "MediaUnavailable": {"description": "已引用媒体不可读取；code=MEDIA_UNAVAILABLE；客户端提示用户重新请求动画以恢复，不在下载请求中渲染。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "RenderUnavailable": {"description": "隔离执行器不可用或无法建立限制；code=RENDER_UNAVAILABLE。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}},
      "ReviewUnavailable": {"description": "审核不可用；code=REVIEW_UNAVAILABLE，禁止正式发布。","content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}
