services:
  postgres:
    image: postgres@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
    environment:
      POSTGRES_DB: edumind_dev
      POSTGRES_USER: edumind
      POSTGRES_PASSWORD: ${EDUMIND_POSTGRES_PASSWORD:-edumind_dev_password}
    volumes:
      - edumind_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${EDUMIND_POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edumind -d edumind_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    volumes:
      - ./data:/workspace/data:ro
      - ${EDUMIND_MEDIA_CACHE_HOST_PATH:-./data/videos/cache}:/workspace/data/videos/cache:ro
    environment:
      EDUMIND_KNOWLEDGE_GRAPH_PATH: /workspace/data/knowledge_graph.yaml
      EDUMIND_ANIMATION_DISPATCH: ${EDUMIND_ANIMATION_DISPATCH:-pg_poll}
      EDUMIND_PRODUCT_MODE: ${EDUMIND_PRODUCT_MODE:-catalog_only}
      EDUMIND_DATABASE_URL: postgresql+asyncpg://edumind:${EDUMIND_POSTGRES_PASSWORD:-edumind_dev_password}@postgres:5432/edumind_dev
      EDUMIND_PROVIDER_BASE_URL: ${EDUMIND_PROVIDER_BASE_URL:-}
      EDUMIND_PROVIDER_API_KEY: ${EDUMIND_PROVIDER_API_KEY:-}
      EDUMIND_PROVIDER_MODEL: ${EDUMIND_PROVIDER_MODEL:-}
      EDUMIND_PROVIDER_STRUCTURED_TRANSPORT: ${EDUMIND_PROVIDER_STRUCTURED_TRANSPORT:-responses_json_schema}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EDUMIND_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health').read()"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: ./web
    environment:
      EDUMIND_API_PROXY_TARGET: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${EDUMIND_WEB_PORT:-5173}:5173"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => { if (!r.ok) process.exit(1) })"]
      interval: 5s
      timeout: 3s
      retries: 20

  animation-broker:
    profiles: [animation-queue]
    image: redis@sha256:02f2cc4882f8bf87c79a220ac958f58c700bdec0dfb9b9ea61b62fb0e8f1bfcf
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec, --maxmemory, 128mb, --maxmemory-policy, noeviction, --aclfile, /run/secrets/animation-redis.acl]
    volumes:
      - edumind_animation_broker_data:/data
      - ${EDUMIND_REDIS_ACL_FILE:-./local-materials/redis/users.acl}:/run/secrets/animation-redis.acl:ro
    networks: [animation_queue]
    mem_limit: 256m
    cpus: 1
    restart: unless-stopped

  animation-dispatcher:
    profiles: [animation-queue]
    build: ./backend
    command: [uv, run, --no-dev, python, scripts/run_animation_dispatcher.py]
    environment:
      EDUMIND_DATABASE_URL: postgresql+asyncpg://edumind:${EDUMIND_POSTGRES_PASSWORD:-edumind_dev_password}@postgres:5432/edumind_dev
      EDUMIND_ANIMATION_BROKER_URL: ${EDUMIND_ANIMATION_BROKER_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
      animation-broker:
        condition: service_started
    networks: [default, animation_queue]
    restart: unless-stopped

networks:
  animation_queue:
    internal: true

volumes:
  edumind_postgres_data:
  edumind_animation_broker_data:
